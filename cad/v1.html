<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>户型重心标注工具</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1b2330;
    --border: #2a3441;
    --border-soft: #202a37;
    --text: #e6edf5;
    --text-muted: #8b97a8;
    --text-faint: #576375;
    --accent: #4fd1ff;
    --accent-dim: #2a5f73;
    --mark: #ff9f43;
    --mark-dim: #7a4d20;
    --grid-line: #1c2531;
    --danger: #ff6b6b;
    --ok: #5ee6a0;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  [data-theme="light"]{
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f5f7fa;
    --border: #d7dee6;
    --border-soft: #e3e8ee;
    --text: #1a2330;
    --text-muted: #5a6676;
    --text-faint: #8b97a8;
    --accent: #0f8fbf;
    --accent-dim: #cdeaf5;
    --mark: #d97a1e;
    --mark-dim: #f5dfc4;
    --grid-line: #e2e7ee;
    --danger: #d9455b;
    --ok: #1f9d63;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    overscroll-behavior:none;
  }
  #app{
    display:flex; flex-direction:column; height:100vh; height:100dvh; width:100%;
  }
  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--border);
    background:var(--panel); flex-shrink:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:26px; height:26px; border-radius:6px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:13px; color:#04202b;
    flex-shrink:0;
  }
  .brand h1{ font-size:15px; margin:0; font-weight:600; letter-spacing:.2px;}
  .brand span{ display:block; font-size:11px; color:var(--text-muted); font-family:var(--mono); margin-top:1px;}
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background .15s, border-color .15s;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .icon-btn svg{ width:18px; height:18px; }

  /* ---------- Layout ---------- */
  #main{ flex:1; display:flex; min-height:0; }
  #sidebar{
    width:328px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px;
  }
  #canvas-wrap{
    flex:1; position:relative; overflow:auto;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:24px 24px;
    display:flex; align-items:center; justify-content:center;
  }
  #canvas-inner{ position:relative; margin:auto; }
  canvas#board{
    max-width:100%; max-height:100%; display:block;
    background:var(--panel-2);
    box-shadow:0 0 0 1px var(--border);
    cursor:crosshair;
    touch-action:none;
  }
  #placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:var(--text-faint); pointer-events:none; text-align:center; padding:20px;
  }
  #placeholder svg{ width:52px; height:52px; opacity:.5; }
  #placeholder b{ color:var(--text-muted); font-weight:500; font-size:14px; }
  #placeholder small{ font-size:12px; }

  /* ---------- Sidebar sections ---------- */
  .card{
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:14px;
  }
  .card h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted);
    margin:0 0 10px 0; font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .card h2 .n{ font-family:var(--mono); color:var(--accent); }

  .dropzone{
    border:1.5px dashed var(--border); border-radius:8px; padding:18px 10px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; color:var(--text-muted); font-size:12.5px;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:rgba(79,209,255,.06); color:var(--text); }
  .dropzone svg{ width:22px; height:22px; margin-bottom:6px; opacity:.7; }
  .dropzone b{ color:var(--text); }
  input[type=file]{ display:none; }

  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  button.btn{
    font-family:var(--sans); font-size:12.5px; font-weight:500; border-radius:7px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    padding:8px 12px; cursor:pointer; transition:border-color .15s, background .15s, opacity .15s;
    display:flex; align-items:center; gap:6px; flex:1; justify-content:center; white-space:nowrap;
  }
  button.btn:hover{ border-color:var(--accent); }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }
  button.btn.primary{ background:var(--accent); border-color:var(--accent); color:#04202b; font-weight:600; }
  button.btn.primary:hover{ filter:brightness(1.08); }
  button.btn.danger:hover{ border-color:var(--danger); color:var(--danger); }
  button.btn svg{ width:14px; height:14px; flex-shrink:0; }

  .hint{ font-size:11.5px; color:var(--text-muted); line-height:1.6; margin-top:8px; }
  .hint kbd{ font-family:var(--mono); background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:10.5px; }

  table.points{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11.5px; margin-top:2px; }
  table.points th{ text-align:left; color:var(--text-faint); font-weight:500; padding:4px 4px; border-bottom:1px solid var(--border-soft); }
  table.points td{ padding:4px 4px; color:var(--text-muted); border-bottom:1px solid var(--border-soft); }
  table.points tr:last-child td{ border-bottom:none; }
  table.points td.del{ cursor:pointer; color:var(--text-faint); text-align:right; }
  table.points td.del:hover{ color:var(--danger); }
  .points-scroll{ max-height:140px; overflow-y:auto; }
  .empty-row{ color:var(--text-faint); font-size:11.5px; text-align:center; padding:10px 0; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:7px; padding:8px 10px;
  }
  .stat .l{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .stat .v{ font-family:var(--mono); font-size:14px; color:var(--text); margin-top:3px; font-weight:600; }
  .stat .v.accent{ color:var(--accent); }
  .stat .v.mark{ color:var(--mark); }
  .stat.full{ grid-column:1 / -1; }

  .scale-status{ font-size:11.5px; font-family:var(--mono); padding:8px 10px; border-radius:7px; background:var(--panel); border:1px solid var(--border-soft); color:var(--text-muted); margin-bottom:10px; }
  .scale-status.set{ color:var(--ok); border-color:var(--ok); }
  .scale-status.active{ color:var(--mark); border-color:var(--mark); }

  input.text-input{
    width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:7px 9px; font-size:12.5px; font-family:var(--mono);
  }
  input.text-input:focus{ outline:none; border-color:var(--accent); }
  select.text-input{ font-family:var(--sans); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:12.5px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Responsive ---------- */
  #sidebar-toggle{ display:none; }
  @media (max-width: 860px){
    #main{ flex-direction:column; }
    #sidebar{
      width:100%; border-right:none; border-bottom:1px solid var(--border);
      max-height:42vh; flex-shrink:0;
    }
    #canvas-wrap{ flex:1; min-height:40vh; }
  }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body data-theme="dark">
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">CG</div>
      <div>
        <h1>户型重心标注工具</h1>
        <span>Centroid Marker · 单页工具</span>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换深色/浅色">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <div id="main">
    <aside id="sidebar">

      <!-- 上传 -->
      <div class="card">
        <h2>1 · 上传户型图</h2>
        <div class="dropzone" id="dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 02 2h12a2 2 0 002-2v-3"/></svg>
          <div><b>点击上传</b> 或拖拽图片到此处</div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <!-- 标点操作 -->
      <div class="card">
        <h2>2 · 标记边角点 <span class="n" id="ptCountTag">(0)</span></h2>
        <div class="btn-row">
          <button class="btn" id="undoBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 15 5v1"/></svg>
            撤销
          </button>
          <button class="btn danger" id="clearBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
            清空
          </button>
        </div>
        <div class="hint">
          在右侧图上依次点击户型<b style="color:var(--text)">外轮廓的每个角点</b>。拖动已放置的点可微调位置，双击点可删除。至少需要 3 个点。
        </div>
        <div class="points-scroll" id="pointsList" style="margin-top:10px;"></div>
      </div>

      <!-- 比例尺标定 -->
      <div class="card">
        <h2>3 · 比例尺标定（可选）</h2>
        <div class="scale-status" id="scaleStatus">未标定 · 面积/坐标按像素显示</div>
        <div class="btn-row">
          <button class="btn" id="calibrateBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M4 8v8M20 8v8"/></svg>
            开始标定
          </button>
          <button class="btn" id="clearScaleBtn" disabled>清除</button>
        </div>
        <div class="hint">点击图上一段已知实际长度的两端（如一面墙），再输入该长度即可换算真实面积与坐标。</div>
      </div>

      <!-- 结果 -->
      <div class="card">
        <h2>4 · 计算结果</h2>
        <div class="stat-grid">
          <div class="stat"><div class="l">顶点数</div><div class="v" id="statPts">0</div></div>
          <div class="stat"><div class="l">周长</div><div class="v" id="statPerim">–</div></div>
          <div class="stat full"><div class="l">面积</div><div class="v accent" id="statArea">–</div></div>
          <div class="stat full"><div class="l">重心坐标</div><div class="v mark" id="statCentroid">–</div></div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn primary" id="exportBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            导出标注图片
          </button>
        </div>
      </div>

    </aside>

    <div id="canvas-wrap">
      <div id="canvas-inner">
        <canvas id="board" width="800" height="600"></canvas>
        <div id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l4-4 4 3 5-6 5 5"/></svg>
          <b>还未上传户型图</b>
          <small>上传图片后，点击轮廓角点即可自动计算重心</small>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  const state = {
    img: null,
    natW: 0, natH: 0,
    points: [],          // {x,y} in natural image pixel coords
    draggingIndex: -1,
    dragMoved: false,
    theme: 'dark',
    calib: { active:false, pts:[], scale:null, unit:'m' }, // scale = real-units per pixel
  };

  const HIT_RADIUS = 12; // in natural px, adjusted by displayed scale at hit-test time

  // ---------------- DOM ----------------
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const undoBtn = document.getElementById('undoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const calibrateBtn = document.getElementById('calibrateBtn');
  const clearScaleBtn = document.getElementById('clearScaleBtn');
  const scaleStatus = document.getElementById('scaleStatus');
  const exportBtn = document.getElementById('exportBtn');
  const pointsList = document.getElementById('pointsList');
  const ptCountTag = document.getElementById('ptCountTag');
  const statPts = document.getElementById('statPts');
  const statPerim = document.getElementById('statPerim');
  const statArea = document.getElementById('statArea');
  const statCentroid = document.getElementById('statCentroid');
  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');
  const toast = document.getElementById('toast');

  const ICONS = {
    moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
  };

  function setTheme(t){
    state.theme = t;
    document.body.setAttribute('data-theme', t);
    themeIcon.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    redraw();
  }
  themeBtn.addEventListener('click', ()=> setTheme(state.theme === 'dark' ? 'light' : 'dark'));
  setTheme('dark');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  // ---------------- Image loading ----------------
  dropzone.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', e=>{
    if(e.target.files[0]) loadFile(e.target.files[0]);
  });
  ['dragenter','dragover'].forEach(ev=>{
    dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(ev=>{
    dropzone.addEventListener(ev, e=>{ e.preventDefault(); dropzone.classList.remove('drag'); });
  });
  dropzone.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if(f && f.type.startsWith('image/')) loadFile(f);
  });

  function loadFile(file){
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        state.img = img;
        state.natW = img.naturalWidth;
        state.natH = img.naturalHeight;
        canvas.width = state.natW;
        canvas.height = state.natH;
        state.points = [];
        state.calib = { active:false, pts:[], scale:null, unit:'m' };
        updateScaleStatus();
        placeholder.style.display = 'none';
        exportBtn.disabled = false;
        refreshAll();
        showToast('图片已加载，请点击标记角点');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------------- Geometry ----------------
  function polygonCentroid(pts){
    const n = pts.length;
    if(n === 0) return null;
    if(n < 3){
      let sx=0, sy=0;
      pts.forEach(p=>{ sx+=p.x; sy+=p.y; });
      return { x: sx/n, y: sy/n, area: 0 };
    }
    let area=0, cx=0, cy=0;
    for(let i=0;i<n;i++){
      const j=(i+1)%n;
      const cross = pts[i].x*pts[j].y - pts[j].x*pts[i].y;
      area += cross;
      cx += (pts[i].x+pts[j].x)*cross;
      cy += (pts[i].y+pts[j].y)*cross;
    }
    area = area/2;
    if(Math.abs(area) < 1e-9){
      let sx=0, sy=0;
      pts.forEach(p=>{ sx+=p.x; sy+=p.y; });
      return { x: sx/n, y: sy/n, area: 0 };
    }
    return { x: cx/(6*area), y: cy/(6*area), area: Math.abs(area) };
  }

  function perimeter(pts){
    const n = pts.length;
    if(n < 2) return 0;
    let per = 0;
    const segs = n >= 3 ? n : n-1; // open path if <3 pts, closed loop if polygon
    for(let i=0;i<segs;i++){
      const j=(i+1)%n;
      per += Math.hypot(pts[j].x-pts[i].x, pts[j].y-pts[i].y);
    }
    return per;
  }

  // ---------------- Drawing ----------------
  function redraw(){
    if(!state.img) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(state.img, 0, 0, canvas.width, canvas.height);

    const cssToNat = canvas.width / canvas.getBoundingClientRect().width || 1;
    const lw = Math.max(1.5, 2.2 * cssToNat);
    const styles = getComputedStyle(document.body);
    const accent = styles.getPropertyValue('--accent').trim() || '#4fd1ff';
    const mark = styles.getPropertyValue('--mark').trim() || '#ff9f43';

    const pts = state.points;

    // polygon fill + outline
    if(pts.length >= 2){
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      if(pts.length >= 3) ctx.closePath();
      if(pts.length >= 3){
        ctx.fillStyle = accent + '22';
        ctx.fill();
      }
      ctx.strokeStyle = accent;
      ctx.lineWidth = lw;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    // points
    pts.forEach((p, i)=>{
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5.5*cssToNat, 0, Math.PI*2);
      ctx.fillStyle = document.body.getAttribute('data-theme')==='dark' ? '#0d1117' : '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2.2*cssToNat;
      ctx.strokeStyle = accent;
      ctx.stroke();
      ctx.fillStyle = accent;
      ctx.font = `${11*cssToNat}px monospace`;
      ctx.fillText(String(i+1), p.x + 9*cssToNat, p.y - 9*cssToNat);
    });

    // calibration points/line
    if(state.calib.pts.length){
      ctx.save();
      ctx.strokeStyle = mark;
      ctx.fillStyle = mark;
      ctx.lineWidth = lw;
      const cp = state.calib.pts;
      if(cp.length === 2){
        ctx.beginPath();
        ctx.moveTo(cp[0].x, cp[0].y);
        ctx.lineTo(cp[1].x, cp[1].y);
        ctx.setLineDash([8*cssToNat,6*cssToNat]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      cp.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5*cssToNat, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.restore();
    }

    // centroid marker
    if(pts.length >= 3){
      const c = polygonCentroid(pts);
      if(c){
        drawCentroidMarker(c.x, c.y, mark, cssToNat);
      }
    }
  }

  function drawCentroidMarker(x, y, color, s){
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.4*s;
    const r1 = 13*s, r2 = 6*s, len = 20*s;
    ctx.beginPath(); ctx.arc(x,y,r1,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,r2,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x-len,y); ctx.lineTo(x-r1,y);
    ctx.moveTo(x+r1,y); ctx.lineTo(x+len,y);
    ctx.moveTo(x,y-len); ctx.lineTo(x,y-r1);
    ctx.moveTo(x,y+r1); ctx.lineTo(x,y+len);
    ctx.stroke();
    // label
    const label = '重心';
    ctx.font = `600 ${13*s}px sans-serif`;
    const textW = ctx.measureText(label).width;
    const padX = 8*s, padY = 5*s, boxH = 20*s;
    const bx = x + len + 6*s, by = y - boxH/2;
    ctx.fillStyle = document.body.getAttribute('data-theme')==='dark' ? 'rgba(13,17,23,.85)' : 'rgba(255,255,255,.9)';
    roundRect(ctx, bx, by, textW+padX*2, boxH, 5*s);
    ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.4*s;
    roundRect(ctx, bx, by, textW+padX*2, boxH, 5*s);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx+padX, by+boxH/2);
    ctx.restore();
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------------- Coordinate mapping ----------------
  function getNaturalPos(evt){
    const rect = canvas.getBoundingClientRect();
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: cx*scaleX, y: cy*scaleY };
  }
  function hitRadiusNatural(){
    const rect = canvas.getBoundingClientRect();
    return HIT_RADIUS * (canvas.width / rect.width);
  }
  function findPointNear(pos){
    const r = hitRadiusNatural();
    for(let i=state.points.length-1;i>=0;i--){
      if(Math.hypot(state.points[i].x-pos.x, state.points[i].y-pos.y) <= r) return i;
    }
    return -1;
  }

  // ---------------- Pointer interaction ----------------
  let downInfo = null;

  function handleDown(evt){
    if(!state.img) return;
    evt.preventDefault();
    const pos = getNaturalPos(evt);

    if(state.calib.active){
      state.calib.pts.push(pos);
      redraw();
      if(state.calib.pts.length === 2){
        finishCalibration();
      }
      return;
    }

    const idx = findPointNear(pos);
    if(idx >= 0){
      state.draggingIndex = idx;
      state.dragMoved = false;
      downInfo = pos;
      return;
    }
    // add new point
    state.points.push(pos);
    refreshAll();
  }

  function handleMove(evt){
    if(state.draggingIndex >= 0){
      evt.preventDefault();
      const pos = getNaturalPos(evt);
      state.points[state.draggingIndex] = pos;
      state.dragMoved = true;
      refreshAll();
    }
  }

  function handleUp(evt){
    if(state.draggingIndex >= 0){
      state.draggingIndex = -1;
    }
  }

  function handleDblClick(evt){
    if(!state.img) return;
    const pos = getNaturalPos(evt);
    const idx = findPointNear(pos);
    if(idx >= 0){
      state.points.splice(idx,1);
      refreshAll();
    }
  }

  canvas.addEventListener('mousedown', handleDown);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleUp);
  canvas.addEventListener('dblclick', handleDblClick);

  canvas.addEventListener('touchstart', handleDown, {passive:false});
  canvas.addEventListener('touchmove', handleMove, {passive:false});
  window.addEventListener('touchend', handleUp);

  let lastTap = 0;
  canvas.addEventListener('touchend', function(evt){
    const now = Date.now();
    if(now - lastTap < 320 && !state.dragMoved){
      handleDblClick(evt.changedTouches ? {clientX:evt.changedTouches[0].clientX, clientY:evt.changedTouches[0].clientY} : evt);
    }
    lastTap = now;
  });

  // ---------------- Buttons ----------------
  undoBtn.addEventListener('click', ()=>{
    state.points.pop();
    refreshAll();
  });
  clearBtn.addEventListener('click', ()=>{
    if(state.points.length && !confirm('确定清空全部标记点？')) return;
    state.points = [];
    refreshAll();
  });
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
      e.preventDefault();
      state.points.pop();
      refreshAll();
    }
  });

  calibrateBtn.addEventListener('click', ()=>{
    if(!state.img){ showToast('请先上传户型图'); return; }
    state.calib.active = true;
    state.calib.pts = [];
    scaleStatus.textContent = '标定中… 请点击已知长度的两个端点';
    scaleStatus.className = 'scale-status active';
  });
  clearScaleBtn.addEventListener('click', ()=>{
    state.calib = { active:false, pts:[], scale:null, unit:'m' };
    updateScaleStatus();
    refreshAll();
  });

  function finishCalibration(){
    const [p1,p2] = state.calib.pts;
    const pixelDist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
    state.calib.active = false;
    setTimeout(()=>{
      const input = prompt('这段线段的实际长度是多少米？（例如 3.6）', '');
      const val = parseFloat(input);
      if(!input || isNaN(val) || val <= 0){
        state.calib.pts = [];
        updateScaleStatus();
        redraw();
        showToast('已取消标定');
        return;
      }
      state.calib.scale = val / pixelDist; // 米 / 像素
      state.calib.unit = 'm';
      updateScaleStatus();
      refreshAll();
      showToast('比例尺标定完成');
    }, 30);
  }

  function updateScaleStatus(){
    if(state.calib.scale){
      scaleStatus.textContent = `已标定 · 1 像素 ≈ ${state.calib.scale.toFixed(5)} 米`;
      scaleStatus.className = 'scale-status set';
      clearScaleBtn.disabled = false;
    } else {
      scaleStatus.textContent = '未标定 · 面积/坐标按像素显示';
      scaleStatus.className = 'scale-status';
      clearScaleBtn.disabled = true;
    }
  }

  exportBtn.addEventListener('click', ()=>{
    if(!state.img) return;
    const link = document.createElement('a');
    link.download = '户型重心标注.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---------------- Info panel ----------------
  function refreshAll(){
    undoBtn.disabled = state.points.length === 0;
    clearBtn.disabled = state.points.length === 0;
    ptCountTag.textContent = `(${state.points.length})`;
    renderPointsList();
    renderStats();
    redraw();
  }

  function renderPointsList(){
    if(state.points.length === 0){
      pointsList.innerHTML = '<div class="empty-row">尚未添加角点</div>';
      return;
    }
    let html = '<table class="points"><thead><tr><th>#</th><th>X</th><th>Y</th><th></th></tr></thead><tbody>';
    state.points.forEach((p,i)=>{
      html += `<tr><td>${i+1}</td><td>${p.x.toFixed(0)}</td><td>${p.y.toFixed(0)}</td><td class="del" data-i="${i}" title="删除">✕</td></tr>`;
    });
    html += '</tbody></table>';
    pointsList.innerHTML = html;
    pointsList.querySelectorAll('.del').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.points.splice(parseInt(el.dataset.i,10),1);
        refreshAll();
      });
    });
  }

  function renderStats(){
    const n = state.points.length;
    statPts.textContent = n;
    if(n < 3){
      statPerim.textContent = n < 2 ? '–' : fmtLen(perimeter(state.points), false);
      statArea.textContent = '–';
      statCentroid.textContent = '–';
      return;
    }
    const c = polygonCentroid(state.points);
    const per = perimeter(state.points);
    statPerim.textContent = fmtLen(per, true);
    statArea.textContent = fmtArea(c.area);
    if(state.calib.scale){
      const rx = (c.x * state.calib.scale);
      const ry = (c.y * state.calib.scale);
      statCentroid.textContent = `${rx.toFixed(2)} m, ${ry.toFixed(2)} m`;
    } else {
      statCentroid.textContent = `${c.x.toFixed(1)} px, ${c.y.toFixed(1)} px`;
    }
  }

  function fmtLen(px, closed){
    if(state.calib.scale){
      return (px * state.calib.scale).toFixed(2) + ' m';
    }
    return px.toFixed(0) + ' px';
  }
  function fmtArea(pxArea){
    if(state.calib.scale){
      return (pxArea * state.calib.scale * state.calib.scale).toFixed(2) + ' m²';
    }
    return pxArea.toFixed(0) + ' px²';
  }

  // ---------------- Resize ----------------
  window.addEventListener('resize', ()=> redraw());

  refreshAll();
})();
</script>
</body>
</html>
